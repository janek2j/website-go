{{ define "body"}} 

<div class="h5 bg-primary text-white text-center m-2 p-2">Create New Item</div>

{{ if gt (len .Errors) 0}}
    <ul class="text-danger mt-3">
        {{ range .Errors }}
            <li>{{ .  }}</li>
        {{ end }}
    </ul>
{{ end }}

<form method="POST" class="m-2">
    <div class="form-group my-1">
        <label>Item name:</label>
        <input name="name" class="form-control" value="{{.Name}}" />
    </div>
    <div class="form-group my-1">
        <label>Item category:</label>
        <input name="category" class="form-control" value="{{.Category}}" />
    </div>
    <div class="form-group my-1">
        <label>Item description:</label>
        <input name="description" class="form-control" value="{{.Description}}" />
    </div>
    <div class="form-group my-1">
        <label>Item price:</label>
        <input name="price" class="form-control" value="{{.Price}}" />
    </div>
    <div class="form-group my-1">
        <label>Is item active for rent?</label>
        <select name="isForRent" class="form-select">
            <option value="true" {{if .IsForRent}}selected{{end}}>
                Yes, item is now for rent
            </option>
            <option value="false" {{if not .IsForRent}}selected{{end}}>
                No, item is not for rent
            </option>
        </select>
    </div>
    <button class="btn btn-primary mt-3" type="submit">
        Submit
    </button>
</form>

{{ end }}
