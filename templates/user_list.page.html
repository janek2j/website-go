{{template "base" .}}

{{ define "content"}} 

<div class="text-center p-2">
    <h2>Here is the list of users</h2>
    <table class="table table-bordered table-striped table-sm">
        <thead>
            <tr><th>User Name</th><th>Email</th></tr>
        </thead>
        <tbody>
            {{ range . }}
                    <tr>
                        <td>{{ .Name }}</td>
                        <td>{{ .Email }}</td>
                    </tr>    
            {{ end }}
        </tbody>
    </table>
</div>

{{ end }}
